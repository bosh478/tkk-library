s":[{"code":"1","count":39074107,"value":"一审"},{"code":"2","count":22868457,"value":"执行"},{"code":"3","count":3861675,"value":"二审"},{"code":"4","count":3863,"value":"再审"},{"code":"5","count":712922,"value":"再审审查与审判监督"},{"code":"6","count":394395,"value":"刑罚变更"},{"code":"99","count":3068150,"value":"其他"}]},"verdictList":{"caseTypes":[],"causes":[],"docTypes":[],"judgeYear":[],"pageNum":1,"pageSize":10,"regions":[],"total":83,"verdictList":[{"caseCode":"（2025）浙0113刑初596号","caseGrade":"指导性案例","courtName":"杭州市临平区人民法院","courtOpinion":"本案的争议焦点为，被告人王某群醉酒后激活车载辅助驾驶功能，没有在主驾驶位执行驾驶操作，是否属于驾驶行为，其行为是否构成危险驾驶罪。\r\n一、被告人王某群系驾驶行为人和责任人\r\n国家标准《汽车驾驶自动化分级》（GB/T40429-2021）将驾驶自动化等级分为0-5级。其中，0-2级为驾驶辅助，3级为有条件自动驾驶，4级为高度自动驾驶，5级为完全自动驾驶。辅助驾驶系统受技术限制，无法保证在所有道路环境下均能安全运行，其功能只是辅助驾驶人驾驶，而不能代替驾驶人成为驾驶主体。驾驶人激活辅助驾驶功能后，仍是实际执行驾驶任务的人，负有确保行车安全的责任。\r\n本案中，被告人王某群驾驶机动车的行为可分为两个阶段。第一阶段，王某群醉酒后以传统人工方式驾驶机动车行驶一段路程，在此阶段认定其为驾驶人没有异议。第二阶段，王某群激活辅助驾驶功能，设置目的地，由辅助驾驶系统执行驾驶任务。因王某群所驾汽车安装的驾驶自动化系统系不能脱离驾驶人监管的2级辅助驾驶系统，故王某群仍然是负责执行驾驶任务的驾驶人，其利用事前安装的非法配件逃避辅助驾驶系统监测，并从主驾驶位移至副驾驶位、双手脱离方向盘并睡觉的行为，在性质上属于违规驾驶，不能以此否认其驾驶人的身份和责任。\r\n二、被告人王某群的行为构成危险驾驶罪\r\n根据《中华人民共和国刑法》第一百三十三条之一的规定，在道路上醉酒驾驶机动车的，构成危险驾驶罪。经鉴定，被告人王某群血液酒精含量为114.5毫克/100毫升，属醉酒。《最高人民法院、最高人民检察院、公安部、司法部关于办理醉酒危险驾驶刑事案件的意见》（高检发办字〔2023〕187号）第十二条第一款规定：“醉驾具有下列情形之一，且不具有本意见第十条规定情形的，可以认定为情节显著轻微、危害不大，依照刑法第十三条、刑事诉讼法第十六条的规定处理：（一）血液酒精含量不满150毫克/100毫升的……”第十条规定：“醉驾具有下列情形之一，尚不构成其他犯罪的，从重处理：……（十三）二年内曾因饮酒后驾驶机动车被查获或者受过行政处罚的……”根据上述规定，虽然王某群血液酒精含量不满150毫克/100毫升，但其在二年内曾因饮酒后驾驶机动车受过行政处罚，故对其此次醉酒驾驶行为不应认定为情节显著轻微、危害不大，而应当以危险驾驶罪定罪处罚。","judgeDate":"2025-09-19","title":"王某群危险驾驶案","verdictId":"sQw3/LTEa8AaHWA3LPiTJNv5BUtZma2B4LgPWFPVnXE="},{"caseCode":"（2024）闽0205民初4139号","caseGrade":"指导性案例","courtName":"厦门市海沧区人民法院","courtOpinion":"对于被保全的款项，人民法院在作出生效裁判后、立案执行前，可以依法对该款项作出扣划裁定（以下简称为执行立案前保全扣划措施）。这种措施可以使债权人在不解除保全措施的情况下尽快实现债权，债务人亦可在不产生执行成本和不影响征信的情况下履行债务，符合双方的利益需求，也有利于节约司法资源。在操作中需要强化审执协同，并注意防范可能存在的损害其他债权人合法权益的情形。\r\n其一，执行立案前采取保全扣划措施，有利于充分发挥财产保全的制度功能。财产保全制度系通过限制被保全人对其财产的处分，实现对债权人诉讼利益的保障，制度要旨在于保障生效法律文书的履行。《中华人民共和国民事诉讼法》第一百零六条规定的财产保全方式为“查封、扣押、冻结或者法律规定的其他方法”，效果在于实现对被保全人财产的控制，而非处分。受保全措施性质所限，以往，即便债务人愿意主动将保全财产用于偿还债务，通常也只能采取两种措施：一是解除保全措施后再由债务人履行相应义务，二是待判决生效后由债权人向人民法院申请强制执行。但是，前者存在转移财产、逃避履行的风险，后者会影响权利人利益的及时实现，也会造成债务人的信用减损。事实上，被保全人自愿履行并申请人民法院扣划保全款项，系当事人对自身权利的处分，符合保全制度宗旨，有利于推动生效法律文书的自动、及时履行，最大化保障各方当事人的合法权益，同时也有助于从源头上减少执行案件、节省执行成本，因此，执行立案前，对被保全人申请扣划保全款项用于履行生效法律文书义务，人民法院经审查认为不存在可能损害其他债权人合法权益情形的，可以准许并扣划被保全人相应款项。通过上述程序债务得以全额清偿的，人民法院可以向被保全人出具自动履行证明。\r\n其二，执行立案前采取保全扣划措施，应当严格审查当事人的申请是否存在虚假诉讼、个别清偿等可能损害其他债权人合法权益的风险。当事人申请在执行立案前采取保全扣划措施的，应当向其释明虚假诉讼等恶意损害其他债权人利益的法律后果，并要求其提交承诺书；受理当事人申请后，要主动检索、核查债务人涉诉涉执案件情况，若发现债务人有其他涉诉案件或者执行案件的，应当根据具体案件情况，在不影响其他债权人利益的基础上，审慎决定是否采取相关保全扣划措施。","judgeDate":"2024-10-24","title":"厦门某健康管理有限公司与福建某体育产业有限公司财产保全扣划实施案","verdictId":"qJ7cKKrFmKCg6S65QlJctANm1nM/b3Oqf6zVQ+rCeV8="},{"caseCode":"（2023）川01执4918号","caseGrade":"指导性案例","courtName":"四川省成都市中级人民法院","courtOpinion":"本案为知识产权领域行为类执行的疑难复杂案件，采取何种执行方式和策略引导、促成执行和解，推动矛盾纠纷“一揽子”化解，实现双赢多赢共赢，是推动本案依法妥善处理的关键。\r\n其一，关于执行方式。参照《中华人民共和国民事诉讼法》第二百三十七条的规定，人民法院自收到申请执行书之日起超过六个月未执行的，结合案件具体情况，上级人民法院可以责令原人民法院限期执行，也可以指令辖区内其他人民法院执行或者直接提级由本院执行。根据《最高人民法院关于人民法院执行工作若干问题的规定（试行）》（法释〔1998〕15号，2020年修正）第七十四条第二款的规定，“对下级法院长期未能执结的案件，确有必要的，上级法院可以决定由本院执行或与下级法院共同执行，也可以指定本辖区其他法院执行。”本案中，申请执行人与被执行人在广东、四川另有3起重大关联案件，申请执行人向法院表达了希望一体化解所有纠纷的意愿。同时，被执行人与侵权设备均在外省，强制拆除案涉生产设备专业要求高、国内没有拆除先例、安全风险大。因此，依靠原执行法院的力量，开展跨省、跨部门协调显然具有较大难度，难以保障执行的效率和效果，有必要通过提级执行等方式，推动案件顺利、高效办理。\r\n其二，关于执行措施。作为执行依据的（2022）最高法知民终541号民事判决明确，销毁有关设备的方式包括但不限于拆除。从本案的具体情况看，简单直接采取强制执行措施并非最佳方案。案涉设备具有易燃易爆属性，拆除具有极强的专业性，操作不当会引发严重化工污染；强制拆除案涉设备将导致企业生产经营难以为继，且会影响相关产业链，对企业生存、职工就业和当地经济发展都会造成一定影响。而案涉生产设备具有可持续生产的条件，不属于需要淘汰的落后产能，如能得到许可，则可以合法继续使用，有利于实现物尽其用，既能维护侵权企业的生存、保障企业职工的就业，也能实现知识产权权利人利益的最大化，无论是经济效益还是社会效益，显然都更好。并且，通过支付侵权赔偿款并就继续实施支付技术许可使用费，从而取得合法使用有关技术设备的授权，同样能够实现裁判要求和维权目的，是技术类知识产权侵权案件中需要特别注重采取的执行措施。鉴此，人民法院加强协调，通过多方联动、多案协同等方式，找准利益平衡点，引导双方达成和解，通过协商确定技术许可使用费等，为权利人提供依法收取技术许可使用费的“积极价值”，代替强制拆除侵权设备的“消极价值”，促成案涉生产设备合法、持续利用。","judgeDate":"2024-08-28","title":"四川某化工股份有限公司与山东某化工股份有限公司等执行实施案","verdictId":"MTP+VORgdZo6XT1IzY/sVwQpkNSEGu/ZKjLH6IBPhCI="},{"caseCode":"（2024）川民终4号","caseGrade":"指导性案例","courtName":"四川省高级人民法院","courtOpinion":"高质量发展和高水平保护相辅相成、相得益彰。发展经济不能对资源和生态环境竭泽而渔，生态环境保护也不是舍弃经济发展而缘木求鱼。《中华人民共和国环境保护法》第一条和第四条明确了保护环境、防治污染，促进经济社会可持续发展的立法目的，体现了协调发展原则。本案中，某水电公司作为案涉项目建设单位，其利用当地丰富的水能资源发电，符合国家因地制宜开发水能、绿色低碳高质量发展要求，契合当地经济社会发展及民众生存发展的需求，符合协同推进降碳减污扩绿增长的国家政策，依法应予支持。但案涉水电站建设同样也要符合生态环境保护的法律政策要求，采取相应措施预防或者减轻对相关流域生态环境的损害或者重大损害风险，统筹兼顾高质量发展与高水平保护。\r\n\r\n根据《最高人民法院关于审理环境民事公益诉讼案件适用法律若干问题的解释》（法释〔2015〕1号，2020年修正）第一条、第十八条的规定，对已经损害社会公共利益或者具有损害社会公共利益重大风险的污染环境、破坏生态的行为，依法可以提起环境民事公益诉讼，要求被告承担民事责任。本案中，昌平某环境研究所虽然提供了某水电公司及其委托承建单位受到行政处罚的相应证据，但结合当地行政部门行政处罚后监管情况，某水电公司及其委托承建单位的行政违法行为已整改到位并通过监管验收。同期人工繁殖工作在川陕哲罗鲑两个驯养基地持续开展，增殖放流站建设滞后并未影响增殖放流工作正常开展。且后续某水电公司没有再因违反相关法律法规而被行政处罚。昌平某环境研究所提交的证据不能证明案涉水电站建设行为已经对川陕哲罗鲑栖息地及周边生态环境造成损害后果，不属于司法解释规定的“已经损害社会公共利益”的情形。\r\n\r\n本案的争议焦点为：案涉建设项目对生态环境是否具有“损害社会公共利益重大风险”。\r\n\r\n其一，案涉建设项目符合国家环境保护法律规定，且已将川陕哲罗鲑保护纳入环境影响评价内容。《中华人民共和国水法》第六条规定：“国家鼓励单位和个人依法开发、利用水资源，并保护其合法权益。”环境保护法第十九条第一款规定：“……建设对环境有影响的项目，应当依法进行环境影响评价。”根据《中华人民共和国环境影响评价法》的相关规定，环境影响评价是指对规划和建设项目实施后可能造成的环境影响进行分析、预测和评估，提出预防或者减轻不良环境影响的对策和措施，进行跟踪监测的方法与制度。据此，对于水电站建设项目，应当依法开展环境影响评价，经行政主管部门审查批准后方能开工建设，并采取预防或者减轻不良环境影响的对策和措施。\r\n\r\n本案中，案涉水电站建设项目的环境影响评价工作符合法律规定，经原环境保护部批准的《环评报告》合法、有效。特别是，《环评报告》《环评批复》已将川陕哲罗鲑作为案涉水电站环境影响的重要敏感保护对象进行了专门的环境分析、影响预测与评价，制定了有针对性的保护措施。案涉水电站在依法取得《环评批复》的前提下，经审批后开工建设，并采取预防或者减轻不良环境影响的有效对策和措施，符合法律规定。\r\n\r\n其二，案涉建设项目采取了有效预防或者减轻对生态环境不良影响的措施。环境保护法第五条确立了“保护优先、预防为主”的基本原则，要求在环境资源利用行为实施前和实施中采取综合手段，防止环境资源利用行为导致环境污染或者生态破坏的现象发生。而环境影响评价也不仅仅是评估建设项目可能造成的环境影响，更是重在采取针对性措施，最大程度预防或者减轻对环境的不良影响。\r\n\r\n本案中，案涉水电站建设项目根据《环评报告》《环评批复》的要求，对栖息地保护、过鱼措施、增殖放流等采取针对性措施，并开展川陕哲罗鲑人工繁殖工作。某水电公司已委托相关单位完成了升鱼机、集运鱼系统等过鱼设施的设计工作，符合环境保护设施与主体工程“同时设计”的要求；持续开展人工繁殖技术研究工作，成功实现川陕哲罗鲑全人工繁殖，并按要求采取了栖息地保护和增殖放流等措施。某水电公司所采取的针对性保护措施进一步推动了川陕哲罗鲑的科学研究进度，扩大了保护范围、加强了保护力度，有利于川陕哲罗鲑的物种生存及生境保护。\r\n\r\n综上，昌平某环境研究所提供的证据不足以证明某水电公司的建设行为对川陕哲罗鲑及周边生态环境具有造成损害的重大风险，依法驳回昌平某环境研究所的诉讼请求。\r\n\r\n需要说明的是，虽然昌平某环境研究所的诉讼主张不能成立，但某水电公司的后续生态环境保护责任并不因本案判决而减轻或者免除，其应当更加注重生态环境保护，继续按《环评批复》及相关法律规定履行生态环境保护责任，主动接受行政主管部门监督，确保各项环保措施按时序进度要求落实到位。","judgeDate":"2024-07-31","title":"北京市昌平区某环境研究所诉某流域水电开发有限公司生态破坏民事公益诉讼案","verdictId":"fI0M8ygPweFWpSEwn2C7ByB8mJshC2JurgmwicVhhp8="},{"caseCode":"（2024）冀0505刑初8号","caseGrade":"指导性案例","courtName":"邢台市任泽区人民法院","courtOpinion":"《中华人民共和国刑法》第一百三十三条规定，“违反交通运输管理法规，因而发生重大事故，致人重伤、死亡或者使公私财产遭受重大损失的”，构成交通肇事罪。《最高人民法院关于审理交通肇事刑事案件具体应用法律若干问题的解释》（法释〔2000〕33号）第二条第一款进一步明确，“死亡一人或者重伤三人以上，负事故全部或者主要责任的”，以交通肇事罪定罪处罚。根据上述规定，本案中，被告人刘某江是否构成交通肇事罪，关键在于其是否负事故全部或者主要责任。\r\n《中华人民共和国道路交通安全法实施条例》第九十二条规定：“发生交通事故后当事人逃逸的，逃逸的当事人承担全部责任。但是，有证据证明对方当事人也有过错的，可以减轻责任。当事人故意破坏、伪造现场、毁灭证据的，承担全部责任。”该规定系基于维护交通秩序、尽可能救济交通事故受害人、有利于查明事故发生原因等目的设立的特别规定，依照该规定认定的事故责任并不必然反映行为人交通违法行为与事故之间的客观因果关系。在办理交通肇事等相关刑事案件时不能直接将上述责任认定结论作为定案根据，而是应当结合在案证据，准确查明事故发生原因以及相关原因对事故发生所起的作用大小，进而认定逃逸当事人是否应负刑法意义上的事故全部或者主要责任。当事人的逃逸行为对引发事故或者扩大事故没有原因力的，不应作为认定刑法意义上事故责任的依据。\r\n本案中，经审查包括交通事故认定书记载的事故发生原因、目击证人证言、被告人供述等全案证据，可以认定：孙某平在与对面来车有会车可能时超车等交通违法行为是造成事故的主要原因；被告人刘某江逃逸前的交通违法行为是事故发生的次要原因，其逃逸行为并非导致事故发生的原因，亦不存在因逃逸致人死亡情节，故其行为依法不构成交通肇事罪。","judgeDate":"2024-07-16","title":"刘某江交通肇事宣告无罪案","verdictId":"I9T7uSjfWp2sAAxWufF+VLycM01I1ubLlKlv6gqOSpo="},{"caseCode":"（2023）沪02民终11028号","caseGrade":"指导性案例","courtName":"上海市第二中级人民法院","courtOpinion":"本案的争议焦点为：某电子公司采集发布案涉数据的行为，是否侵害某钢铁公司的合法权益。\r\n第一，某钢铁公司和某电子公司分别享有不同的数据权益。某钢铁公司作为钢材生产商，在生产和对外销售各种型号钢材的过程中，产生一系列的价格数据。某电子公司作为数据处理者，采集汇总包括某钢铁公司产品的出厂价格、代理商价格在内的原始数据，经过算法技术加工后形成数据产品。对此，应当根据数据来源和生成特征，妥当界分数据参与各方享有的权益：（1）产品出厂价格是某钢铁公司在经营主营业务过程中产生的数据，某钢铁公司享有持有、使用等权益，但钢材交易市场是竞争较为充分的市场，产品出厂价格已公开，某钢铁公司不能禁止他人合法合理采集使用；（2）由于代理商价格是在某钢铁公司产品出厂后的下游交易链条中产生，并无证据证明某钢铁公司直接参与了该数据的产生、发布，故难以认定某钢铁公司对代理商价格享有限制他人采集使用的权益；（3）根据国家发展改革委关于价格指数行为管理的相关规定，在中华人民共和国境内依法成立的企业、事业单位、团体及其他组织可以编制发布价格指数。据此，某电子公司可以编制发布钢材价格指数。而相关价格指数系某电子公司通过采集原始价格数据后，经技术分析而成，属于数据产品。对于这一数据产品，某电子公司享有经营性利益。\r\n第二，某电子公司采集加工数据的行为具有正当性。数据信息具有非排他性。通常而言，对于不属于国家秘密、个人信息和商业秘密的数据信息，应允许自由流动，非因法定事由不应过度管控，以防止形成“数据壁垒”、“信息封闭”。本案中，案涉产品出厂价格系公开市场中自由流通的信息，不涉及产品成本、工艺等商业秘密，采集、使用该类信息用于编制行业价格指数，没有违反法律法规。具体而言，其一，某钢铁公司主张其产品的出厂价格属于商业秘密。根据《中华人民共和国反不正当竞争法》的规定，构成商业秘密，应满足不为公众所知悉、具有商业价值、采取保密措施三个条件。根据《最高人民法院关于审理侵犯商业秘密民事案件适用法律若干问题的规定》（法释〔2020〕7号）第四条第一款第五项的规定，“所属领域的相关人员从其他公开渠道可以获得该信息的”，人民法院可以认定有关信息为公众所知悉。而某钢铁公司主动在无入群资格审核的数百人的微信群中发布产品出厂价格，也未禁止群成员对外再传播。可见，某钢铁公司未采取有效保密措施，其产品出厂价格已在一定范围公开，不符合“不为公众所知悉”的商业秘密构成要件。因此，某钢铁公司关于案涉数据构成商业秘密的主张不能成立。其二，某钢铁公司与某电子公司签订合作协议的目的是购买某电子公司的相关服务，而非授权某电子公司采集、加工、使用出厂价格，故案涉合同关系并非某电子公司采集出厂价格具备合法性的必要条件。其三，根据国家发展改革委关于价格指数行为管理的相关规定，某电子公司组建信息采集团队，通过在公众号和微信群中采集、电话询问、销售合同披露等方式独立采集数据，并未采取误导、欺诈、胁迫、窃取等方式，其信息来源合法。\r\n第三，没有证据证明某钢铁公司的数据权益受到损害。某电子公司正当获取和合理使用案涉数据的行为，实际并未影响或者剥夺某钢铁公司对出厂价格数据的持有、使用等权益，更未对某钢铁公司造成经济损失，故某电子公司并未损害某钢铁公司的数据权益。当然，如果有证据证明数据质量存在问题，某钢铁公司可以向某电子公司主张承担包括损害赔偿在内的相关责任。但是，本案并无证据证明数据质量存在问题。某电子公司合法采集某钢铁公司的价格数据，编制方法符合有关标准，故基础数据和编制方法均无问题；而某钢铁公司称数据产品不真实、不客观、不公允，但未提供充分证据证明。\r\n综上，某电子公司采集加工数据行为不存在侵害某钢铁公司数据权益的情形，且根据在案证据无法认定数据产品质量存在问题。对某钢铁公司关于某电子公司采集加工数据形成数据产品侵害其合法权益的主张，人民法院依法不予支持。","judgeDate":"2024-06-19","title":"某钢铁有限公司诉某电子商务股份有限公司侵权责任纠纷案","verdictId":"yBDpPZrGsKwfa+YecpO0Fkb/wAFnWgfWFy2j095EGew="},{"caseCode":"（2024）浙0114破1-6号之二","caseGrade":"指导性案例","courtName":"杭州市钱塘区人民法院","courtOpinion":"本案中，被执行人涉及多起案件，不同人民法院已分别立案执行；执行过程中，被执行人资不抵债，又向人民法院提出预重整申请，如何依法统筹推进、稳妥办理系列执行案件，如何协调执行程序与预重整程序的关系，需作特殊考量。\r\n其一，以指定一个人民法院统一执行的方式有效推进执行工作。通过指定执行，将原属不同人民法院立案执行的同一被执行人系列案件集中至其中一个人民法院执行，能够有效解决因多头执行、强制措施重叠、执行思路不一导致的“执行难”等问题。本案中，涉及浙江某新材料公司等被执行人的主要债务及抵押权债务的多个案件在萧山区人民法院执行，因行政区划调整，后有多起劳动争议案件在钱塘区人民法院执行，且浙江某新材料公司向钱塘区人民法院提出了预重整的申请。杭州市中级人民法院依法指定钱塘区人民法院统一执行有关系列案件，可以整合资源，在保障各债权人合法权益的同时，统筹预重整阶段的协商谈判，帮助被执行企业摆脱困境、实现重生，更好地实现涉企执行案件的清理与市场主体的有效救治。\r\n其二，畅通执破衔接机制，助力企业再生。对于经营困难企业作为被执行人的案件，可以通过加强立审执协调等措施，分类施策，推进执破衔接。对于资不抵债且确无救治必要和可能的企业，依法适用破产清算程序，及时进行出清；对于一些有潜力、有前景的企业，应当尽力通过破产重整、破产和解等方式帮助企业化解危机。本案中，浙江某新材料公司虽然已经资不抵债，但其拥有自主知识产权，相关技术在行业内处于领先水平，行业前景较好，潜在偿债能力较强，具有挽救价值，有关预重整方案也已经得到多数债权人支持，具备重整可能。依法适用破产重整，不仅有助于该公司造血重生，也能最大限度公平维护各方当事人合法权益，减少债权实现的综合成本，有利于实现最佳办案效果。","judgeDate":"2024-06-18","title":"浙江某新材料股份有限公司系列执行实施案","verdictId":"euOugSjOG/mH0QN7txlVU+PXjov6zR+BhX1sE1mAMXk="},{"caseCode":"（2023）最高法知民终1590号","caseGrade":"指导性案例","courtName":"最高人民法院","courtOpinion":"本案的争议焦点为：威某方是否侵害了吉某方的案涉技术秘密，以及如构成侵权如何确定其民事责任。\r\n\r\n一、威某方是否侵害了吉某方的案涉技术秘密\r\n\r\n本案中，成都高某公司的高级管理人员及技术人员，包括该公司总经理、项目研发组组长、技术副总、技术部部长，以及具体从事汽车底盘技术研发的多名曾接触或者掌握案涉技术秘密的员工等近40人在2016年7月前后陆续离职，加入威某方及其关联公司，从事包括新能源汽车底盘技术研发在内的相关工作。而威某温州公司成立于2016年5月9日，其首辆EX5型号电动汽车于2018年9月即开始销售，前后仅两年多时间即实现电动汽车量产及销售。威某方显然具有接触吉某方案涉技术秘密的渠道和机会。同时，威某方申请的12件实用新型专利文件部分披露了吉某方案涉图纸及数模承载的技术秘密。将威某方EX5型号电动汽车底盘零部件图纸及数模与吉某方的案涉12套图纸及数模进行比较，存在大量完全相同的技术信息，其中包括吉某方特有的技术信息，足以证明威某方在其电动汽车底盘及底盘零部件制造中使用了吉某方案涉技术秘密。\r\n\r\n成都高某公司多名曾接触或者掌握案涉技术秘密的员工从原单位较短时间内大量离职并入职威某方及其关联公司；在案证据已经证明威某方使用了吉某方部分完全相同的案涉技术信息，包括吉某方特有的技术信息；且威某方在明显短于独立研发所需合理时间内即生产出与案涉技术秘密相关的产品，故可以减轻技术秘密权利人对于侵害技术秘密行为的证明负担，不再要求吉某方就全部案涉技术秘密被侵害承担进一步举证责任，而是基于上述事实和汽车制造领域研发规律、生产经验，直接推定威某方实际获取、使用了吉某方全部案涉技术秘密。威某方如欲否定该推定，应当提供足以反驳的相反证据。\r\n\r\n被诉侵权人实际使用案涉技术秘密的方式既可能是直接使用，也可能是在案涉技术秘密的基础上进行修改、改进、调整、优化后使用。无论以上哪种方式的使用，均构成法律意义上的侵权行为。本案中，威某方基于产品定位、成本控制及自身车型的特殊性等因素，在吉某方案涉技术秘密基础上对部分技术进行了修改、改进，这并不影响相关技术整体实质性相同的判断，不影响威某方行为构成技术秘密侵权的法律性质认定。同时，威某方提供的证据不足以反驳对其侵害全部案涉技术秘密的事实推定。故可以认定威某EX系列全部型号电动汽车使用了相同底盘技术，构成对吉某方案涉技术秘密的侵害。\r\n\r\n二、威某方应当承担何种民事责任\r\n\r\n威某方四公司在实施侵害案涉技术秘密的行为中，主观上具有共同的侵权过错，客观上其行为属于分工协作、相互配合，构成共同侵权，应依法连带承担赔偿损失、停止侵害等民事责任。\r\n\r\n关于赔偿损失，一审法院仅认定威某方侵害吉某方5套汽车底盘零部件图纸及数模技术秘密，且未能查明吉某方实际损失或者威某方侵权获利情况，故酌情判令威某方赔偿吉某方经济损失500万元，以及合理开支200万元；二审法院在全面认定威某方侵害吉某方12套汽车底盘零部件图纸及数模技术秘密的事实基础上，通过威某方招股说明书记载的威某EX系列型号电动汽车的销售额等数据，认定威某方的侵权获利金额，并对其中发生于2019年4月之后的获利依法适用2倍惩罚性赔偿（2019年4月23日修正并施行的反不正当竞争法对惩罚性赔偿作出规定），故判令威某方赔偿吉某方经济损失637596249.6元，并酌情支持吉某方一、二审维权合理开支500万元。\r\n\r\n关于停止侵害，为保障权利人及时实现合法权益，人民法院可以结合具体案情，尽可能细化停止侵害的具体方式、内容、范围等，以增强裁判的可执行性和威慑力。本案中，鉴于威某方侵权情节恶劣、规模巨大、后果严重，且存在继续侵权和损害后果扩大的可能性，故而有必要采取切实有效且合理可行的细化措施，以确保全面有效制止威某方的侵权行为：一方面，在总体判令威某方立即停止披露、使用、允许他人使用吉某方案涉技术秘密的基础上，进一步明确停止侵害的具体方式、内容和范围等；另一方面，在综合考虑侵权行为性质、情节和违反停止侵害义务可能产生的损害等因素的基础上，对非金钱给付义务迟延履行金的计付标准分情形予以明确，以确保威某方及时全面停止侵害，防止侵害后果进一步扩大，并督促威某方及时履行判决确定的非金钱给付义务。\r\n\r\n本案判决送达后，威某方积极主动按期在《人民法院报》刊登了关于判令其停止侵害吉某方案涉技术秘密的公告，并将案涉12件实用新型专利转给吉某方；吉某方与威某方两次就案涉12件实用新型专利的技术交底书及申请文件、威某EX系列车型的底盘零部件的图纸、数模进行销毁，且双方确认相关图纸、资料等销毁完毕；威某方通过企业微信等方式履行了通知其股东、董事、监事、高级管理人员、所有员工和子公司、分公司的义务，并向特定人员、对外投资的子公司的法定代表人、供应商送达了本案生效判决及停止侵害通知、保守商业秘密及不侵权承诺，并经吉某方确认威某方已经履行完毕通知义务。截至2024年8月中旬，本案生效判决确定的非金钱义务已经履行完毕。有关金钱给付义务判项，已在威某方破产重整程序中统筹处理。","judgeDate":"2024-04-25","title":"浙江吉某控股集团有限公司、浙江吉某汽车研究院有限公司诉威某汽车制造温州有限公司等侵害技术秘密纠纷案","verdictId":"VKdjcI2fOYUhOHNS1FQUsyU19lUHwJ4xGh2yFnGlUCo="},{"caseCode":"（2023）最高法民再262号","caseGrade":"指导性案例","courtName":"最高人民法院","courtOpinion":"本案的争议焦点为：在债权人持续向债务人主张权利且普通诉讼时效因多次中断而期间未届满的情形下，是否适用二十年最长权利保护期间的规定。\r\n\r\n民法典第一百八十八条规定：“向人民法院请求保护民事权利的诉讼时效期间为三年。法律另有规定的，依照其规定。”“诉讼时效期间自权利人知道或者应当知道权利受到损害以及义务人之日起计算。法律另有规定的，依照其规定。但是，自权利受到损害之日起超过二十年的，人民法院不予保护，有特殊情况的，人民法院可以根据权利人的申请决定延长。”从上述规定看，我国民事法律对普通诉讼时效期间的起算点采用的是主观标准，即“自权利人知道或者应当知道权利受到损害以及义务人之日起计算”。为避免法律关系始终处于不确定状态，该条同时规定了起算点采客观标准的最长权利保护期间，即“自权利受到损害之日起超过二十年的，人民法院不予保护”。根据法律规定，最长权利保护期间主要是解决在权利人长时间不知道其权利受到损害或者不知道义务人、无法主张权利的情形下，如何确定保护期间的问题。对于是否适用二十年的最长权利保护期间，人民法院应当根据权利人知道或者应当知道权利受到损害以及义务人的时间节点并结合普通诉讼时效期间是否经过等事实综合认定。\r\n\r\n本案中，案涉借款于1998年6月30日履行期限届满后，债务人德惠市某原种场已于2006年12月12日通过在《债务逾期催收通知书》上盖章并签署“情况属实”字样对原债务进行了重新确认，此后债权人通过向德惠市某原种场发出《债务逾期催收通知书》以及刊发催收公告等方式多次主张权利，上述行为均构成了普通诉讼时效的有效中断。在此情形下，尽管原告长春某泽投资有限公司提起本案诉讼时，距案涉借款履行期限届满之日已超过二十年，但不适用民事法律关于二十年最长权利保护期间的规定。主要理由如下：\r\n\r\n第一，从立法目的看，诉讼时效制度旨在督促权利人及时行使权利，维护社会关系、交易秩序的稳定。本案中，债权人持续主张权利，并未怠于行使权利，依法构成诉讼时效中断。同时，最长权利保护期间主要是解决权利人长时间不知道其权利受到损害以及不知道义务人、无法主张权利的情形下如何确定保护期间的问题，而本案不属于该种情形，不应适用民事法律关于二十年最长权利保护期间的规定。\r\n\r\n第二，从价值导向看，法律制度及其理解适用应尽可能减少诉讼，而不是相反。诉讼时效制度的功能在于督促权利人及时行使权利，在债权人持续主张权利且债务人认可的情形下，如果仅因债权人未在二十年的期间内通过诉讼方式主张权利而发生“人民法院不予保护”的法律后果，无异于是鼓励债权人以起诉方式保存权利，既损害交易双方的信任基础，又增加司法资源的耗费，不符合法律制度的目的和精神。同时，债务人在催收通知书上签字盖章，该行为使债权人对债务人能够履行债务具有合理期待并可能基于此种信赖推迟诉讼。在此情形下，债务人又提出时效抗辩有违诚实信用原则，该行为不应鼓励。故对于债权人持续向债务人主张权利且普通诉讼时效因多次中断而期间未届满的，不应以超过二十年最长权利保护期间为由，对债权人的权利不予保护。","judgeDate":"2024-03-11","title":"长春某泽投资有限公司诉德惠市某原种场等金融借款合同纠纷案","verdictId":"vYtm72lhxnLvr5ihiwPcUPydhtS7rQ4QJhOgdvLOmqE="},{"caseCode":"（2023）浙72民初314号","caseGrade":"指导性案例","courtName":"宁波海事法院","courtOpinion":"本案系涉外船舶碰撞损害责任纠纷。宁波海事法院根据环某船舶公司的申请，依据《中华人民共和国海事诉讼特别程序法》相关规定扣押了“某风”轮。该法第十九条规定：“海事请求保全执行后，有关海事纠纷未进入诉讼或者仲裁程序的，当事人就该海事请求，可以向采取海事请求保全的海事法院或者其他有管辖权的海事法院提起诉讼，但当事人之间订有诉讼管辖协议或者仲裁协议的除外。”环某船舶公司据此向宁波海事法院提起诉讼，宁波海事法院对本案具有管辖权。\r\n\r\n《中华人民共和国海商法》第二百七十三条第一款规定：“船舶碰撞的损害赔偿，适用侵权行为地法律。”涉外民事关系法律适用法第四十四条规定：“侵权责任，适用侵权行为地法律，但当事人有共同经常居所地的，适用共同经常居所地法律。侵权行为发生后，当事人协议选择适用法律的，按照其协议。”虽然海商法作为特别法，没有明确规定船舶碰撞纠纷当事人可以选择适用法律，但涉外民事关系法律适用法对当事人选择侵权责任适用的法律作了明确规定。故船舶碰撞纠纷当事人选择适用法律并不属于选择无效的情形。就本案而言，双方当事人均系在马绍尔群岛共和国注册的公司，案涉两船船籍国分别为巴拿马和利比里亚。庭审中，原告、被告一致提出本案侵权责任纠纷适用中国法律。由于涉外民事关系法律适用法已对当事人协议选择侵权责任适用法律作了明确规定，故应当认定本案原告、被告双方适用中国法律的选择有效。","judgeDate":"2024-02-07","title":"环某船舶租赁有限责任公司诉天某财富有限公司船舶碰撞损害责任纠纷案","verdictId":"0Bw999AqSLWTRrKgxfiRNcZ4U7TezOPjRM0dy2uZxX0="}]}},"result":{"description":"礼品卡的法律界定主要围绕赠与合同进行，以下是详细分析：1、定义与性质：礼品卡是预付费购物凭证，属于赠与合同的一种，发行与兑换过程实质上是赠与合同的订立与履行。2、法律特征：具有无偿性、单务性和诺成性。3、使用中的法律问题：包括有效期问题、退换问题和商家责任。消费者应了解并遵守相关法律法规和商家规定，维护自己的合法权益。","keywords":"礼品卡, 法律界定, 赠与合同, 无偿性, 单务性, 诺成性","publishTime":"0001-01-01","title":"礼品卡的法律界定","toutiaoURL":"https://www.faxingbao.com/legalarticle/qadetail?id=7d845ed83e1706241121","updateTime":"0001-01-01"}} || {};
